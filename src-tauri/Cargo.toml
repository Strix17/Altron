[package]
name = "altron"
version = "1.0.0"
description = "Altron AI Desktop Assistant"
authors = ["Altron"]
edition = "2021"

[lib]
name = "altron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "altron"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
